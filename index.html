<!DOCTYPE html>
<!-- スマレコ (SmartRecord) 起動ローダー v1.1
     v1.1（2026-09-17・v82.1）: LINE の中で開いたら、1回だけ外のブラウザへ切り替える（openExternalBrowser=1）。
       Google のログインは LINE の中の画面では使えないため。JavaScript が動かない表示でも本体へのリンクを出す。
     目的: 端末に古い版が残り続ける問題を構造的に解消する。
       本体は app.html に置き、このローダーが毎回タイムスタンプ付きで読み込む。
       ローダー自身は数百バイトで、キャッシュ禁止のヘッダを持つ。
     配置: release リポの index.html としてデプロイする（本体は app.html） -->
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Smart Record</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #475569;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #d1fae5;
      border-top-color: #15803d;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg { font-size: 13px; }
    .fallback { font-size: 12px; color: #64748b; }
    .fallback a { color: #15803d; font-weight: 700; }
  </style>
</head>

<body>
  <div class="spinner"></div>
  <div class="msg">Smart Record を読み込んでいます…</div>
  <div class="fallback" id="fallback" style="display:none">
    自動で切り替わらない場合は <a id="manual-link" href="app.html">こちらをタップ</a> してください。
  </div>
  <noscript>
    <div class="fallback" style="display:block">この表示では Smart Record を開けません。Chrome や Safari などのブラウザで開いてください。</div>
  </noscript>
  <script>
    // 本体は app.html。毎回タイムスタンプを付けることで、端末に古い版が残っていても
    // 必ず最新が読み込まれる（このローダー自体はキャッシュ禁止・数百バイト）。
    (function () {
      var url = 'app.html?v=' + Date.now();
      var link = document.getElementById('manual-link');
      if (link) link.href = url;
      // 逃げ道のリンクは、どの分かれ道より先に用意する（切り替えが止められても白いままにしない）
      setTimeout(function () {
        var fb = document.getElementById('fallback');
        if (fb) fb.style.display = 'block';
      }, 3000);
      // v1.1: LINE の中の画面では Google のログインが使えない。LINE の仕組みで外のブラウザへ切り替える。
      //   切り替えた後も LINE の中の画面は残って読み込みを続けるので、繰り返さないよう1回だけにする。
      try {
        var ua = navigator.userAgent || '';
        if (/\bLine\//i.test(ua) && !/[?&]openExternalBrowser=1/.test(location.search)) {
          var tried = false;
          try { tried = sessionStorage.getItem('smareco_line_xb') === '1'; sessionStorage.setItem('smareco_line_xb', '1'); } catch (e) {}
          if (!tried) { location.replace(location.pathname + '?openExternalBrowser=1'); return; }
        }
      } catch (e) {}
      location.replace(url);
    })();
  </script>
</body>

</html>
